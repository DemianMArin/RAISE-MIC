# Stack and heap sizes
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=4096

# BLE basic
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="NEW_NAME"
CONFIG_BT_DEVICE_APPEARANCE=0
CONFIG_BT_GATT_DYNAMIC_DB=y
#CONFIG_BT_SETTINGS=y
#CONFIG_SETTINGS=y

# Throughput tuning
# CONFIG_BT_CONN_TX_MAX=40
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_TX_COUNT=40
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_RX_COUNT=40
CONFIG_BT_BUF_EVT_RX_COUNT=50
CONFIG_BT_GATT_NOTIFY_MULTIPLE=y
# 2PHY
# CONFIG_BT_PHY_UPDATE=y
# CONFIG_BT_USER_PHY_UPDATE=y
# CONFIG_BT_CTLR_PHY_2M=y

## Audio sampling
CONFIG_NRFX_SAADC=y
CONFIG_NRFX_GPPI=y
CONFIG_NRFX_TIMER22=y

# Logging and serial
CONFIG_LOG=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG_BACKEND_UART=y

# Log format customization
# Disable timestamp (removes [00:00:00.004,988])
CONFIG_LOG_BACKEND_FORMAT_TIMESTAMP=n
CONFIG_LOG_MODE_MINIMAL=y
# CONFIG_LOG_BACKEND_SHOW_COLOR=n        # Disable colors
# CONFIG_LOG_FUNC_NAME_PREFIX_INF=n      # Remove <inf> prefix


# CLK config
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y

# LC3 Codec 
CONFIG_FPU=y
# CONFIG_FPU_SHARING=y
# CONFIG_TFM=n
# CONFIG_TFM_ENABLE_FP=y
# CONFIG_TFM_ENABLE_CP10CP11=y

CONFIG_NEWLIB_LIBC=y
CONFIG_CMSIS_DSP=y
CONFIG_SW_CODEC_LC3_T2_SOFTWARE=y
CONFIG_LC3_ENC_CHAN_MAX=1

